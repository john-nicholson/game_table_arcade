set $mod Mod4
font pango:DejaVu Sans 12
floating_modifier $mod
default_border none
default_floating_border none
focus_follows_mouse no
workspace_layout tabbed
for_window [class="(?i)retroarch"] fullscreen enable
bindsym $mod+Return exec xterm
bindsym $mod+a exec --no-startup-id ~/.local/bin/game-table launch
bindsym $mod+Shift+e exec "i3-nagbar -t warning -m 'Log out of the arcade?' -B 'Log out' 'i3-msg exit'"
bindsym $mod+Shift+p exec "i3-nagbar -t warning -m 'Close the game to save progress before shutting down.' -B 'Shut down' 'systemctl poweroff'"
bindsym $mod+Shift+q kill
exec --no-startup-id ~/.local/bin/game-table launch
